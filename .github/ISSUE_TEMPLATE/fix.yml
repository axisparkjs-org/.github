name: Fix
description: Report a bug or something that is not working as expected
title: '[Fix] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before opening the issue, please check that it has not been reported already.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong and where. Include error messages, logs or screenshots if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code needed to reproduce the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the affected packages, Node.js and operating system.
      placeholder: |
        - Package: @axisparkjs/http 1.3.0
        - Node.js: 24.x
        - OS: Ubuntu 24.04
    validations:
      required: false
